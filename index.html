<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="国際小包料金">
<meta name="theme-color" content="#d9652b">
<link rel="apple-touch-icon" sizes="180x180" id="appleIcon" href="">
<link rel="icon" type="image/png" id="favIcon" href="">
<title>国際小包料金表</title>
<style>
:root{
  --navy:#1f3a5f; --navy2:#2d4f7c; --bg:#f3f5f9; --card:#fff; --text:#1b2433; --sub:#5d6b80;
  --line:#d6dce6; --grid:#3a3a3a; --hl:#fff3c4; --hlLine:#e0b300; --red:#c62828; --chip:#e8edf5;
  --ems:#e8743b; --air:#3a7bd5; --sea:#5a9e3a;
}
body.m-ems{--navy:#d9652b;--navy2:#b84d17;--tint:#ffe9e1;--colsel:#fff6cf;--chip:#fbe9df}
body.m-air{--navy:#2f7fd0;--navy2:#1d62ad;--tint:#dff2ff;--colsel:#fff6cf;--chip:#e3eef9}
body.m-sea{--navy:#4e9a2f;--navy2:#3a7d1f;--tint:#e7f8dc;--colsel:#fff6cf;--chip:#e5f2dc}
body{transition:background .2s}
td:first-child{background:var(--tint)}
.seg{background:#e8edf5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 12px 8px;border-bottom:1px solid var(--line)}
h1{margin:0 0 10px;font-size:24px;color:var(--navy);display:flex;align-items:center;gap:6px}
h1 small{font-size:11px;color:var(--sub);font-weight:normal;margin-left:auto}
.mute{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:16px;padding:2px 6px;line-height:1.2}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:8px;font-size:15px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button.on[data-k=ems]{color:var(--ems)} .seg button.on[data-k=air]{color:var(--air)} .seg button.on[data-k=sea]{color:var(--sea)}
.seg{background:#eef1f5!important}
.seg button[data-k=ems]{background:#fde6da;color:#d9652b}
.seg button[data-k=air]{background:#dcecfb;color:#2f7fd0}
.seg button[data-k=sea]{background:#e2f3d8;color:#4e9a2f}
.seg button.on[data-k=ems]{background:#e8743b;color:#fff}
.seg button.on[data-k=air]{background:#3a86d6;color:#fff}
.seg button.on[data-k=sea]{background:#5aa53a;color:#fff}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.calc button.clr{background:#fff;color:#444;border:1.5px solid #999}
.calc{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:nowrap}
.inwrap{position:relative;flex:1;min-width:0}
.calc input{width:100%;min-width:0;font-size:17px;padding:9px 26px 9px 10px;border:1.5px solid #000;border-radius:8px;background:var(--card);color:var(--text)}
.calc input::placeholder{color:#000;opacity:1}  /* 「重さ」の文字は黒 */
.calc .unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:14px;color:#000;pointer-events:none}
.calc button{flex:0 0 auto;border:0;background:var(--navy);color:#fff;padding:10px 11px;border-radius:8px;font-size:14px;font-weight:700;white-space:nowrap;height:42px}
.calc button.mic{width:42px;padding:0;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.calc button.mic.on{background:var(--navy);color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.6)}100%{box-shadow:0 0 0 10px rgba(229,57,53,0)}}
.vrow{display:none;align-items:center;gap:8px;margin-top:6px}
.vrow.show{display:flex}
.vmsg{flex:1;min-width:0;font-size:11px;color:var(--sub)}
.result{margin:8px 0 0;background:var(--card);border:2px solid var(--navy2);border-radius:12px;padding:6px 8px 8px;display:none}
.result .w{font-size:15px;color:#333}
.result .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.result .grid button{text-align:center;padding:4px 1px;min-width:0;border-radius:8px;background:var(--chip);border:1.5px solid var(--navy);color:var(--text);font:inherit;cursor:pointer}
.result .grid button:active{transform:scale(.96)}
.result .grid button.sel{background:var(--navy);color:#fff}
.result .zsel{margin-top:4px;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;line-height:1.25}
.result .zsel .zn2{font-size:17px;font-weight:500;color:var(--navy2);white-space:nowrap}
.result .zsel big{font-size:32px;font-weight:500;color:#000;white-space:nowrap;letter-spacing:-.5px;line-height:1.1}
.result .zsel big small{font-size:18px;margin-left:1px}
.result .zsel .zd{grid-column:1 / -1;font-size:min(14px,3.4vw);font-weight:400;color:#222;margin-top:2px;line-height:1.35;white-space:nowrap;letter-spacing:-.3px;overflow:hidden;text-overflow:clip}
.result .hint{margin-top:4px;font-weight:700;text-align:center;font-size:11px;color:var(--sub)}
.result .grid b{display:block;font-size:14px;margin-top:1px;letter-spacing:-.2px}
.result .grid span{display:block;font-size:10px;line-height:1.25;white-space:nowrap;overflow:hidden}
.result .grid span.zn{font-weight:700;opacity:.75}
.result .msg{color:var(--red);font-size:13px}
main{padding:10px 12px 30px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1.5px solid var(--grid);font-variant-numeric:tabular-nums}
td{color:#000}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);font-size:14px}
th{position:sticky;top:var(--hdr,0px);z-index:5;background:var(--navy);color:#fff;font-size:11px;text-align:center;font-weight:600;line-height:1.25}
td:first-child{text-align:center;font-weight:700;color:#000;white-space:nowrap;font-size:13px}
td.r{color:var(--red)}
td.colsel{background:var(--colsel)}
th.zb{cursor:pointer;padding:5px 2px}
th.zb span{display:block;border:1.5px solid rgba(255,255,255,.75);border-radius:7px;padding:4px 1px;background:rgba(255,255,255,.12)}
th.zb:active span{transform:scale(.95)}
th.colsel span{background:#ffe27a;color:#000;border-color:#ffe27a;font-weight:700}
tr.hl td{background:var(--hl)!important}
tr.hl td.colsel{background:#ffe27a!important;font-weight:700}
tr.hl td:first-child{box-shadow:inset 4px 0 0 var(--hlLine)}
tbody tr:last-child td{border-bottom:0}
th:last-child,td:last-child{border-right:0}
.note{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.6}
.note .r{color:var(--red)}
.legend{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text)}
.legend b{display:block;color:var(--navy);margin-bottom:6px}
.legend div{padding:4px 0;border-top:1px dashed var(--line)}
.legend i{font-style:normal;display:inline-block;background:var(--navy);color:#fff;border-radius:4px;padding:1px 6px;margin-right:8px;font-size:11px}
/* === Claude Code のキャラクター（ヘッダー左上） === */
.cc-wrap { width: 62px; height: 40px; flex-shrink: 0; display: flex; justify-content: center; margin-left: 12px; }  /* 郵便料金計算と同じく左端から少し離す */
.cc-mascot { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; padding-top: 4px; }
.cc-mascot svg { width: 51px; height: 34.5px; shape-rendering: crispEdges; overflow: visible; }  /* 右の約15pxはノートパソコンが出る場所。中の絵は ccTyping が描く */
.cc-mascot .cc-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: #d97757; opacity: 0.8; white-space: nowrap; font-weight: normal; }
/* === GitHub のマーク（ヘッダー左上、オレンジのキャラクターの右） ===
   横には動かず、その場で：タコの足をゆらゆら・ときどき首をかしげる・ときどき目をパチッ。タップすると1回転 */
.gh-mascot { --gh-disc: #24292f; --gh-cat: #f3f5f9; --gh-text: #57606a; }   /* 明るいヘッダー用 */
.gh-wrap { width: 50px; height: 46px; flex-shrink: 0; display: flex; justify-content: center; align-items: flex-end; margin-right: 6px; margin-left: -16.5px; }   /* オレンジとの間を8pxに詰める */
.gh-mascot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 46px; gap: 3px; text-decoration: none; }
.gh-mascot svg { width: 24px; height: 24px; overflow: visible; }
.gh-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: var(--gh-text); opacity: 0.8; white-space: nowrap; font-weight: normal; }
.gh-disc, .gh-dot { fill: var(--gh-disc); }
.gh-cat { fill: var(--gh-cat); }
.gh-tail-line { fill: none; stroke: var(--gh-cat); stroke-width: 0.8; stroke-linecap: round; }
.gh-all { transform-box: view-box; transform-origin: 8px 8px; }
.gh-head { transform-box: view-box; transform-origin: 8px 10.4px; animation: gh-tilt 5s ease-in-out infinite; }
.gh-tail { transform-box: view-box; transform-origin: 6.5px 12.35px; animation: gh-wag 1.4s ease-in-out infinite alternate; }
.gh-eyes { fill: var(--gh-disc); transform-box: fill-box; transform-origin: center; animation: gh-wink 6s 2s infinite; }
.gh-mascot.spin .gh-all { animation: gh-spin 0.7s cubic-bezier(0.34,1.4,0.64,1); }
/* 2つのロゴの並びをそろえる：下の文字（Claude Code / GitHub）を同じ高さにし、絵はその上に下ぞろえで置く */
.cc-wrap { height: 46px; align-items: flex-end; }
.cc-mascot { height: 46px; justify-content: flex-end; padding-top: 0; gap: 3px; }
/* タイトルは1行に。幅が狭いスマホでは少し詰める */
h1 .ttl, h1 small { white-space: nowrap; }
h1 #ico { font-size: .78em; }   /* ⚡✈️🚢 は文字より少し小さく */
@media (max-width: 400px) { h1 { font-size: 22px; gap: 4px; } .gh-wrap { width: 32px; margin-right: 0; margin-left: 0; justify-content: flex-start; padding-left: 2px; } .cc-wrap { width: 57px; padding-left: 4px; justify-content: flex-start; } }
@media (max-width: 370px) { h1 { font-size: 20px; } }
@keyframes gh-tilt { 0%,60%,100% { transform: rotate(0); } 68% { transform: rotate(-9deg); } 78% { transform: rotate(-9deg); } 86% { transform: rotate(6deg); } 92% { transform: rotate(0); } }
@keyframes gh-wag { from { transform: rotate(-14deg); } to { transform: rotate(12deg); } }
@keyframes gh-wink { 0%,88%,100% { transform: scaleY(0); } 90%,95% { transform: scaleY(1); } }
@keyframes gh-spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }

/* === オープニング（開いたときに出る画面。ゆうパック運賃 近畿発と同じ作り）
   クリーム色の紙に、アイコンと同じ紺の文字（まわりの斜めじまは付けない） */
.op{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
  background:#fffaf0;color:#243e62;cursor:pointer;transition:opacity .5s,visibility .5s;overflow:auto}
.op.hide{opacity:0;visibility:hidden}
.op-in{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.op-sub{margin:0;font-size:.85rem;font-weight:700;background:#243e62;color:#fff;border-radius:999px;padding:3px 14px;animation:op-drop .5s both}
/* 「国際小包」と「料金表」は同じ大きさ */
.op-t{margin:0;display:flex;flex-direction:column;line-height:1.15;color:#243e62;font-size:2.7rem;letter-spacing:.06em}
.op-t span,.op-t b{font-size:inherit;font-weight:800;padding-left:.06em}   /* 字間のぶん左に足して真ん中にそろえる */
.op-t span{animation:op-drop .6s .1s both}
.op-t b{animation:op-drop .6s .25s both}
.op-kinds{display:flex;gap:8px;animation:op-drop .6s .32s both}
.op-kinds i{font-style:normal;font-size:.85rem;font-weight:800;color:#fff;border-radius:8px;padding:4px 12px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.op-kinds i:nth-child(1){background:#da5b23}
.op-kinds i:nth-child(2){background:#2371c5}
.op-kinds i:nth-child(3){background:#429126}
/* キャラクターの台（白いカード） */
.op-chars{display:flex;align-items:flex-end;justify-content:center;gap:26px;background:#fff;border:1.5px solid #e6dcc8;border-radius:18px;padding:16px 24px 10px;box-shadow:0 4px 0 rgba(36,62,98,.12);animation:op-rise .6s .4s both}
.op-c{display:flex;flex-direction:column;align-items:center;gap:6px;font:10px -apple-system,"Segoe UI",sans-serif;letter-spacing:.05em}
.op-cc{width:102px;height:69px;shape-rendering:crispEdges;overflow:visible}
.op-c.cc span{color:#d97757}
.op-gh{--gh-disc:#24292f;--gh-cat:#fff;color:#57606a}
.op-gh svg{width:48px;height:48px;overflow:visible}   /* オレンジの体（頭から足先まで48px）と高さをそろえる */
.op-gh.spin .gh-all{animation:gh-spin .7s cubic-bezier(.34,1.4,.64,1)}
.op-hello{margin:0;font-size:1rem;font-weight:700;animation:op-rise .6s .55s both}
.op-tip{margin:0;font-size:.85rem;line-height:1.5;min-height:3em;background:rgba(36,62,98,.08);border-radius:10px;padding:8px 12px;animation:op-rise .6s .65s both}
.op-bar{width:72%;height:6px;background:rgba(36,62,98,.15);border-radius:3px;overflow:hidden}
.op-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,#d6322f 0 6px,#fff 6px 9px,#1f3a8a 9px 15px,#fff 15px 18px);transition:width 1.5s linear}
.op-go{font:inherit;font-weight:700;font-size:1.05rem;background:#243e62;color:#fff;border:0;border-radius:999px;padding:12px 30px;box-shadow:0 4px 0 rgba(0,0,0,.18);animation:op-pulse 1.4s ease-in-out infinite}
.op-go.busy{animation:none;opacity:.85}
@keyframes op-drop{from{transform:translateY(-24px);opacity:0}}
@keyframes op-rise{from{transform:translateY(20px);opacity:0}}
@keyframes op-pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.op *{animation:none!important}}
/* キャラクターの下の「Claude Code」「GitHub」の文字を太く */
.cc-label, .gh-label, .op-c > span { font-weight: 700 !important; }
/* 夜にキャラクターを起こすボタン（自己紹介の画面・小さな起こす画面） */
#ccIntro .ccx-wake { background: #d97757; color: #fff; border: none; }
#ccIntro .ccx-wake[hidden], #ccWakePop[hidden] { display: none !important; }
#ccWakePop { position: fixed; inset: 0; z-index: 99999; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 20px; }
#ccWakePop .ccw-box { background: #0b1120; border: 3px double #f8f8f8; border-radius: 6px; padding: 16px; max-width: 300px; color: #f8f8f8; font: 700 14px/1.7 -apple-system, 'Hiragino Sans', sans-serif; text-align: center; }
#ccWakePop .ccw-btns { display: flex; gap: 8px; margin-top: 12px; }
#ccWakePop button { flex: 1; padding: 10px; border-radius: 10px; border: none; font: inherit; cursor: pointer; }
#ccWakePop .ccw-wake { background: #d97757; color: #fff; }
#ccWakePop .ccw-close { background: #f8f8f8; color: #0b1120; }
</style>
</head>
<body class="m-ems">
<!-- ===== キャラクターの自己紹介（左上の Claude Code と GitHub のマークをタップすると出る。cc-intro） ===== -->
<style>
  #ccIntro {
    display: none; position: fixed; inset: 0; z-index: 99999;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    align-items: center; justify-content: center; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
  }
  #ccIntro.show { display: flex; animation: ccIntroFade 0.2s; }
  @keyframes ccIntroFade { from { opacity: 0; } to { opacity: 1; } }
  #ccIntro .ccx-box {
    width: 100%; max-width: 330px; box-sizing: border-box;
    background: #0b1120; border: 3px double #f8f8f8; border-radius: 6px;
    padding: 18px 16px 14px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #ccIntro .ccx-pic { height: 104px; display: none; align-items: flex-end; justify-content: center; margin-bottom: 8px; }
  #ccIntro .ccx-box[data-who="cc"] .ccx-pic-cc, #ccIntro .ccx-box[data-who="gh"] .ccx-pic-gh { display: flex; }
  #ccIntro .ccx-pic-cc svg { width: 153px; height: 103.5px; shape-rendering: crispEdges; overflow: visible; }
  #ccIntro .ccx-pic .gh-mascot { --gh-disc: #e6edf3; --gh-cat: #0b1120; height: auto; display: block; }
  #ccIntro .ccx-pic .gh-mascot svg { width: 88px; height: 88px; overflow: visible; }
  #ccIntro .ccx-name { font-size: 17px; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
  #ccIntro .ccx-box[data-who="cc"] .ccx-name { color: #d97757; }
  #ccIntro .ccx-box[data-who="gh"] .ccx-name { color: #e6edf3; }
  #ccIntro .ccx-msg {
    text-align: left; min-height: 8.8em; box-sizing: border-box;
    background: #000; border: 2px solid #475569; border-radius: 4px;
    padding: 10px 12px;
    color: #f8f8f8; font-size: 14px; font-weight: 700; line-height: 1.75;
    white-space: pre-line;
  }
  #ccIntro .ccx-actions { display: flex; gap: 8px; margin-top: 12px; }
  #ccIntro .ccx-btn {
    flex: 1; padding: 11px 8px; border-radius: 10px; box-sizing: border-box;
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none;
    display: flex; align-items: center; justify-content: center;
  }
  #ccIntro .ccx-link { background: rgba(51, 65, 85, 0.6); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }
  #ccIntro .ccx-close { background: #f8f8f8; color: #0b1120; border: none; }
  #ccIntro .ccx-btn:active { transform: scale(0.97); }
</style>

      <svg viewBox="0 0 16 16" aria-hidden="true">

            <g class="gh-head">
              <path class="gh-cat" d="M4.15 4.75 C3.85 3.85 3.95 2.85 4.3 2.1 C4.3 2.1 5.05 1.95 6.35 2.9 C6.9 2.75 7.45 2.68 8 2.68 C8.55 2.68 9.1 2.75 9.65 2.9 C10.95 1.95 11.7 2.1 11.7 2.1 C12.05 2.85 12.15 3.85 11.85 4.75 C12.4 5.3 12.75 6.0 12.75 6.95 C12.75 9.75 10.95 10.45 8 10.55 C5.05 10.45 3.25 9.75 3.25 6.95 C3.25 6.0 3.6 5.3 4.15 4.75 Z"/>
              <rect class="gh-eyes" x="5.5" y="6.1" width="1" height="1.5" rx="0.5"/>
              <rect class="gh-eyes" x="9.5" y="6.1" width="1" height="1.5" rx="0.5"/>
            </g>
            <g class="gh-tail">
              <path class="gh-tail-line" d="M6.5 12.35 C5.3 12.55 4.65 12.0 4.25 11.25 C3.95 10.7 3.6 10.35 3.0 10.25"/>

function jnum(t){ // 漢数字→数値
  const D={"〇":0,"零":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
  const U={"十":10,"百":100,"千":1000};
  let tot=0,sec=0,n=0,has=false;
  for(const c of t){
    if(c in D){n=D[c];has=true;}
    else if(c in U){sec+=(n||1)*U[c];n=0;has=true;}
    else if(c==="万"){tot+=(sec+n||1)*10000;sec=0;n=0;has=true;}
  }
  return has?tot+sec+n:NaN;
}
function toNum(t){
  if(!t) return NaN;
  t=t.replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，、\s]/g,"");
  if(/^[0-9.]+$/.test(t)) return parseFloat(t);
  if(/^[0-9]+[万千百]/.test(t)) t=t.replace(/[0-9]+/g,d=>[..."〇一二三四五六七八九"][0]&&d.split("").map(x=>"〇一二三四五六七八九"[x]).join(""));
  return jnum(t);
}
function parseVoice(raw){
  let t=raw.replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，、。\s]/g,"")
    .replace(/キログラム|キロ|kg|KG|㎏/g,"K").replace(/グラム|g|G|ｇ/g,"G").replace(/てん|点/g,".");
  let m=t.match(/^([0-9.〇零一二三四五六七八九十百千万]+)K(半)?([0-9〇零一二三四五六七八九十百千万]+)?G?$/);
  if(m){ let g=toNum(m[1])*1000; if(m[2]) g+=500; if(m[3]) g+=toNum(m[3]); return Math.round(g); }
  m=t.match(/^([0-9.〇零一二三四五六七八九十百千万]+)G?$/);
  if(m) return Math.round(toNum(m[1]));
  m=t.match(/([0-9.]+)/); return m?Math.round(parseFloat(m[1])):NaN;
}

}

// 食べたぶんを切り取る（side='left' は左から、'top' は上から）
function trim(rects, side, edge) {
  return rects.flatMap(([c, x, y, w, h]) => {
    if (side === 'left') { if (x + w <= edge) return []; const nx = Math.max(x, edge); return [[c, nx, y, w - (nx - x), h]]; }
    if (y + h <= edge) return []; const ny = Math.max(y, edge); return [[c, x, ny, w, h - (ny - y)]];
  });
}

function eatHeld(sprite, W, H, side, end, extraEnd = []) {
  const at = (x, y, b) => b <= 0 ? sprite(x, y) : trim(sprite(x, y), side, side === 'left' ? x + Math.round(W * b / 3) : y + Math.round(H * b / 3));

  const s = [[fig({ mouth: 'closed', extra: at(rx, ry, 0) }), 650]];
  for (let b = 0; b < 3; b++) {
    s.push([fig({ r: 'up', mouth: 'open', extra: at(mx, my, b) }), 260]);
    s.push([fig({ r: 'up', mouth: 'closed', extra: at(mx, my, b + 1) }), 160]);
    for (let c = 0; c < 3; c++) s.push([fig({ eyes: 'happy', mouth: c % 2 ? 'open' : 'closed', squash: c % 2, extra: at(rx, ry, b + 1) }), 190]);
  }
  s.push([fig({ eyes: 'happy', cheek: true, mouth: 'closed', extra: [...end, ...extraEnd] }), 900], [fig({ eyes: 'happy', cheek: true }), 400]);
  return s;
}

}

function dress(name, desc, cos, o = {}) {
  const arms = o.arms || 'wave';
  const s = [[fig(), 400], [fig({ eyes: 'closed', extra: poof }), 250], [fig({ eyes: 'closed', extra: [...cos(0, 0), ...poof.slice(0, 3)] }), 200]];

    s.push([fig({ dy: t, eyes: o.eyes || (k % 3 === 2 ? 'closed' : 'happy'), mouth: o.mouth, dx: o.step ? (k % 2 ? 1 : -1) : 0, lift: o.stomp ? (k % 2 ? [0, 1] : [2, 3]) : [],

  }
  s.push([fig({ eyes: 'happy', cheek: !o.nocheek, mouth: o.mouth, nolegs: o.nolegs, extra: [...cos(0, 0), ...spark(-4, -8), ...spark(26, -10)] }), 800]);
  return { name, desc, seq: s };
}

16,2 0,3,20,2 0,5,6,2 8,5,8,2 18,5,2,2 4,7,16,1 4,8,18,4 4,12,16,1 4,13,2,3 8,13,2,3 14,13,2,3 18,13,2,3|K6,5,2,2 16,5,2,2","O4,0,16,2 4,2,2,2 8,2,8,2 18,2,2,2 4,4,16,1 0,5,24,4 4,9,16,3 4,12,2,4 8,12,2,4 14,12,2,4 18,12,2,4|K6,2,2,2 16,2,2,2"];
  // [コマ番号, 長さ（1/30秒単位）] の順番（動画と同じ。最初の60＝2秒は正面で止まっている）
  const SEQ = [[0,60],[1,3],[2,2],[1,3],[2,5],[3,2],[4,5],[5,3],[6,2],[7,2],[8,3],[9,3],[10,2],[11,3],[12,2],[10,3],[11,2],[12,3],[10,2],[11,3],[12,3],[10,2],[11,3],[12,2],[10,3],[11,2],[12,3],[10,2],[13,2],[14,3],[15,2],[16,3],[17,5],[18,3],[19,2],[0,29]];
  const COLOR = { O: '#d97757', D: '#b46348', G: '#8a8a8a', K: '#1a1612' };
  const svgOf = FRAMES.map(f => f.split('|').map(part => {
    const fill = COLOR[part[0]];
    return part.slice(1).split(' ').map(r => {
      const [x, y, w, h] = r.split(',');
      return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + fill + '"/>';
    }).join('');
  }).join(''));
  const total = SEQ.reduce((s, q) => s + q[1], 0);
  // data-skip="60" を付けた絵（オープニング）は、最初の止まっている2秒を飛ばしてすぐ打ちはじめる
  const shown = new Map();
  function frameAt(t) {
    t %= total;
    for (const [f, len] of SEQ) { if (t < len) return f; t -= len; }
    return SEQ[0][0];
  }
  // 夜の0時〜朝7時は「おやすみ」：目をとじて、すうすう息をして、Zが浮かぶ（0.48秒ごとに8コマ）
  const SLEEP0 = svgOf.length, rect = (x, y, w, h, c) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c + '"/>';
  const zee = (x, y) => rect(x, y, 3, 1, '#8fa3d6') + rect(x + 1, y + 1, 1, 1, '#8fa3d6') + rect(x, y + 2, 3, 1, '#8fa3d6');
  for (let i = 0; i < 8; i++) {
    const s = i % 2, k = i % 4, o = COLOR.O;
    // 寝ているときは右に5マスずらして、体を下の「Claude Code」の文字の真ん中にそろえる（絵の幅34マスの真ん中＝17）
    svgOf.push('<g transform="translate(5,0)">' + rect(4, s, 16, 12 - s, o) + rect(0, s + 4, 4, 4, o) + rect(20, s + 4, 4, 4, o) +
      [4, 8, 14, 18].map(x => rect(x, 12, 2, 4, o)).join('') +
      rect(6, s * 2 + 3, 2, 1, COLOR.K) + rect(16, s * 2 + 3, 2, 1, COLOR.K) +
      zee(22, -1 - k) + (k >= 2 ? zee(26, -6 - (k - 2)) : '') + '</g>');
  }
  // 朝7時〜夜0時は、最初にパソコンを1回打ったあとは、01〜120・136〜175 の動きからずっとランダムに出す。動き（見本ページの番号）からランダムに1つを1回だけ入れる
  //   入れる動きの絵は svgOf の X0 番から後ろに入れかえて使う
  const TYPE_MS = total * 1000 / 30, EVERY = 1, X0 = svgOf.length;
  let mv = null, typeOff = 0, nextAt = TYPE_MS * EVERY, done = 0, last = -1;
  const RUN = Infinity;   // 最初にパソコンを1回打ったあとは、ずっとランダムな動きを続ける
  // 一度出た動きは、ぜんぶ一周するまで出さない（混ぜた順番で1つずつ出す。一周したら、また混ぜなおす）
  //   残りの順番はこの端末に覚えておくので、アプリを閉じて開き直しても続きから出る
  let bag = [];
  try { const b = JSON.parse(localStorage.getItem('ccMoveBag') || '[]'); if (Array.isArray(b) && b.every(i => Number.isInteger(i) && i >= 0 && i < window.CC_EXTRA.length)) bag = b; } catch (e) {}
  function nextPick() {
    if (!bag.length) {
      bag = window.CC_EXTRA.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
      if (bag.length > 1 && bag[bag.length - 1] === last) [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];   // 一周のつなぎ目でも同じ動きを続けない
    }
    last = bag.pop();
    try { localStorage.setItem('ccMoveBag', JSON.stringify(bag)); } catch (e) {}
    return last;
  }
  function extraId(now) {
    if (!window.CC_EXTRA) return -1;
    if (!mv) {
      if (now < nextAt) return -1;
      const i = nextPick();   // 一周するまで同じ動きは出ない
      const seq = window.CC_EXTRA[i].seq;
      svgOf.length = X0;
      seq.forEach(q => svgOf.push('<g transform="translate(5,0)">' + q[0].map(([c, x, y, w, h]) => rect(x, y, w, h, c)).join('') + '</g>'));
      mv = { t0: now, seq, total: seq.reduce((s, q) => s + q[1], 0) };
    }
    let t = now - mv.t0;
    if (t >= mv.total) {   // 1回おわったら、パソコンを打つ動きを最初から（また1回打ったら次の動き）
      mv = null; done = (done + 1) % RUN;
      if (done) { nextAt = now; return extraId(now); }   // 続けて次の動き
      typeOff = Math.floor(now / (1000 / 30)); nextAt = now + TYPE_MS * EVERY; return -1;
    }
    for (let k = 0; k < mv.seq.length; k++) { if (t < mv.seq[k][1]) return X0 + k; t -= mv.seq[k][1]; }
    return X0;
  }
  function draw(now) {
    const base = Math.floor(now / (1000 / 30));
    svgs.forEach(s => {
      const x = extraId(now), id = new Date().getHours() < 7 && !window.CC_AWAKE ? SLEEP0 + Math.floor(now / 480) % 8 : x >= 0 ? x : frameAt(base - typeOff + (+s.dataset.skip || 0));   // 夜はおやすみ
      if (shown.get(s) !== id) { s.innerHTML = svgOf[id]; shown.set(s, id); }
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

(function ghMascot() {
  const gh = document.querySelector('.gh-mascot');
  if (!gh) return;
  gh.addEventListener('pointerdown', function() {
    gh.classList.remove('spin'); void gh.offsetWidth; gh.classList.add('spin');
  });
  gh.addEventListener('animationend', function(e) {
    if (e.animationName === 'gh-spin') gh.classList.remove('spin');
  });
})();

(function ccIcon() {
  const appleIcon = document.getElementById('appleIcon');
  const favIcon = document.getElementById('favIcon');
  const S = 180;
  function finish(ctx, canvas) {
    var p=3, ox=14, oy=72;   // 1ドットの大きさと位置（180px。タイトルと箱にかからない左側）
    var px=function(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(ox+x*p,oy+y*p,w*p,h*p);};
    var o='#d97757';
    px(2,0,8,6,o); px(0,2,2,2,o); px(10,2,2,2,o);
    px(2,6,1,2,o); px(4,6,1,2,o); px(7,6,1,2,o); px(9,6,1,2,o);
    px(3,1,1,1,'#1a1612'); px(8,1,1,1,'#1a1612');
    const url = canvas.toDataURL('image/png');
    appleIcon.href = url; favIcon.href = url;
  }
  const canvas = document.createElement('canvas');
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');
  if (ICON_SRC) {
    const img = new Image();
    img.onload = function() { ctx.drawImage(img, 0, 0, S, S); finish(ctx, canvas); };
    img.src = ICON_SRC;
  } else {
    // 仮のアイコン：白地にオレンジで「国際小包」
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S);
    ctx.fillStyle = '#e8743b'; ctx.fillRect(0, 118, S, 62);
    ctx.fillStyle = '#d9652b'; ctx.textAlign = 'center';
    ctx.font = 'bold 40px "Hiragino Sans","Noto Sans JP",sans-serif';
    ctx.fillText('国際', 112, 70);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 34px "Hiragino Sans","Noto Sans JP",sans-serif';
    ctx.fillText('小包料金', 90, 162);
    finish(ctx, canvas);
  }
})();

// =============================================================
// オープニング：タップすると、カタカタ（キーボード）→ ピロリン の音が鳴り、
//   白いバーが伸びきったら料金表に切りかわる。準備中にもう一度タップするとすぐ閉じる
// =============================================================
(function opening() {
  const op = $("op");
  if (!op) return;
  const h = new Date().getHours();
  $("ophello").textContent = h < 5 ? "夜おそくまで、おつかれさまです" : h < 11 ? "おはようございます" : h < 17 ? "こんにちは" : "おつかれさまです";
  const TIPS = [
    "EMS は30kgまで。重さは「〜まで」の区分です",
    "航空便・船便は1kg単位で切り上げます（1,200g → 2kg）",
    "第3・第4地帯の EMS と航空便は、特別追加料金を含んだ金額です",
    "米国（グアム等を含む）は第4地帯です",
    "メキシコは第3地帯、中南米（メキシコ以外）は第5地帯です",
    "マイクのボタンで「2キロ300」のように話して入力できます",
    "表の「第1〜第5」をタップすると、その地帯の料金が大きく出ます"];
  $("optip").textContent = "ひとこと：" + TIPS[Math.floor(Math.random() * TIPS.length)];
  document.documentElement.style.overflow = "hidden";   // オープニング中は後ろの画面を動かさない

  let started = false;
  function close() {
    op.classList.add("hide");
    document.documentElement.style.overflow = "";
    setTimeout(() => op.remove(), 600);
  }
  op.addEventListener("click", () => {
    if (started) { close(); return; }
    started = true;
    snd("tab");
    $("opgo").textContent = "準備中…"; $("opgo").classList.add("busy");
    op.querySelector(".op-gh").classList.add("spin");            // GitHub のマークがくるっと回る
    for (let i = 0; i < 14; i++) keySnd(.15 + i * .095 + Math.random() * .03);   // カタカタ…
    requestAnimationFrame(() => { $("opbar").style.width = "100%"; });
    setTimeout(() => snd("found"), 1650);                        // ピロリン
    setTimeout(close, 2300);
  });
})();
</script>
<script>
// =============================================================
// キャラクターの自己紹介（cc-intro）
//   左上の Claude Code（オレンジ）と GitHub のマークをタップすると、それぞれが1文字ずつ「ピッ」と鳴らしながら自己紹介する。
//   公式ページは自己紹介の画面の「公式ページを見る」から開く
// =============================================================
(function ccIntro() {
  const APP = '国際小包料金表';
  const INTRO = {
    cc: {
      name: 'Claude Code（クロード・コード）',
      link: 'https://claude.com/claude-code',
      text: 'やあ！ ぼくは Claude Code。\nAnthropic が作った AI だよ。\n話しかけるだけで アプリを\n作ったり 直したり できるんだ。\nこの' + APP + 'も\nいっしょに作ったよ！'
    },
    gh: {
      name: 'GitHub（ギットハブ）',
      link: 'https://github.com/aaiuioo-maker/kokusai-kozutsumi',
      text: 'ぼくは GitHub の オクトキャット。\nプログラムを しまっておく\n大きな本だな だよ。\n' + APP + 'は ここに置いてあって\nスマホからも 開けるんだ。'
    }
  };
  const overlay = document.getElementById('ccIntro');
  const box = overlay && overlay.querySelector('.ccx-box');
  if (!box) return;
  const msg = box.querySelector('.ccx-msg');
  let full = '', pos = 0, timer = null, ac = null;

  // 効果音（このアプリの音とは別に、自己紹介だけで使う）
  function tone(freq, dur, vol) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'square'; o.frequency.setValueAtTime(freq, ac.currentTime);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.start(); o.stop(ac.currentTime + dur + 0.02);
    } catch (e) {}
  }
  const blip = () => tone(1100, 0.03, 0.045);

  function open(who) {
    const d = INTRO[who];
    box.dataset.who = who;
    box.querySelector('.ccx-name').textContent = d.name;
    box.querySelector('.ccx-link').href = d.link;
    full = d.text; pos = 0; msg.textContent = '';
    overlay.classList.add('show');
    tone(1200, 0.05, 0.04);
    clearTimeout(timer); timer = setTimeout(type, 300);
  }
  function type() {
    if (pos >= full.length) return;
    pos++; msg.textContent = full.slice(0, pos);
    const c = full.charAt(pos - 1);
    if (c !== ' ' && c !== '\n' && c !== '…') blip();
    timer = setTimeout(type, c === '\n' ? 300 : 45);
  }
  // 文字の途中でタップしたら、残りを一気に出す
  msg.addEventListener('click', () => { clearTimeout(timer); pos = full.length; msg.textContent = full; });
  function close() { clearTimeout(timer); overlay.classList.remove('show'); tone(440, 0.08, 0.04); }
  box.querySelector('.ccx-close').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  document.querySelectorAll('.cc-mascot').forEach(el => {
    if (el.closest('#ccIntro')) return;
    el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); open('cc'); });
  });
  // GitHub のマークは、くるっと1回転してから自己紹介
  document.querySelectorAll('.gh-mascot').forEach(el => {
    if (el.closest('#ccIntro')) return;
    el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); setTimeout(() => open('gh'), 450); });
  });
})();
</script>

<script>
// =============================================================
// 夜（0時〜朝7時）にオレンジのキャラクターをタップすると、自己紹介の画面に「おこす」ボタンが出る。
//   押すと、アプリを閉じるまで起きて、ランダムな動きをする（閉じて開き直すと、また寝る）
// =============================================================
(function ccWake() {
  window.CC_AWAKE = false;
  const sleeping = () => new Date().getHours() < 7 && !window.CC_AWAKE;
  const intro = document.getElementById('ccIntro');
  if (intro) {
    const box = intro.querySelector('.ccx-box'), btn = intro.querySelector('.ccx-wake');
    if (!box || !btn) return;
    const sync = () => { btn.hidden = !(intro.classList.contains('show') && box.dataset.who === 'cc' && sleeping()); };
    new MutationObserver(sync).observe(intro, { attributes: true, subtree: true, attributeFilter: ['class', 'data-who'] });
    btn.addEventListener('click', () => { window.CC_AWAKE = true; btn.hidden = true; intro.querySelector('.ccx-close').click(); });
    return;
  }
  // 自己紹介の画面がないアプリ：寝ているときにタップすると、小さな「おこす」画面を出す
  const a = document.querySelector('.cc-mascot');
  if (!a) return;
  const pop = document.createElement('div');
  pop.id = 'ccWakePop'; pop.hidden = true;
  pop.innerHTML = '<div class="ccw-box"><p>オレンジのキャラクターは、いま ねています… zzz</p>' +
    '<div class="ccw-btns"><button type="button" class="ccw-wake">おこす</button><button type="button" class="ccw-close">とじる</button></div></div>';
  document.body.appendChild(pop);
  a.addEventListener('click', e => { if (!sleeping()) return; e.preventDefault(); pop.hidden = false; });
  pop.querySelector('.ccw-wake').addEventListener('click', () => { window.CC_AWAKE = true; pop.hidden = true; });
  pop.querySelector('.ccw-close').addEventListener('click', () => { pop.hidden = true; });
  pop.addEventListener('click', e => { if (e.target === pop) pop.hidden = true; });
})();
</script>
</body>
</html>
